
name: CI/CD - ECR to Amazon Linux

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: json-app
      CONTAINER_NAME: json-app
      APP_PORT: 3000

    steps:
      # 1. Get the latest code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Check AWS
      - name: Check AWS identity
        run: |
          aws --version
          aws sts get-caller-identity

      # 3. Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region $AWS_REGION \
            | docker login \
            --username AWS \
            --password-stdin \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .

      # 5. Tag image
      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # 6. Push image to ECR
      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # 7. Pull latest image on Amazon Linux
      - name: Pull image
        run: |
          docker pull \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # 8. Stop old container
      - name: Stop old container
        run: |
          docker stop $CONTAINER_NAME || true
          docker rm $CONTAINER_NAME || true

      # 9. Start new container
      - name: Start new container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            --restart unless-stopped \
            -p $APP_PORT:$APP_PORT \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      # 10. Check deployment
      - name: Verify deployment
        run: |
          sleep 5
          docker ps
          docker logs --tail 50 $CONTAINER_NAME

      # 11. Health check
      - name: Health check
        run: |
          curl --fail http://localhost:$APP_PORT

