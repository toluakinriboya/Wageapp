
name: Deploy Reactive

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "507744946752"
  ECR_REPOSITORY: reactive
  CONTAINER_NAME: reactive
  CONTAINER_PORT: 4173
  HOST_PORT: 4173

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Check runner and Docker permissions
      # --------------------------------------------------
      - name: Check runner
        run: |
          echo "======================================"
          echo "USER"
          echo "======================================"
          whoami

          echo ""
          echo "======================================"
          echo "ID"
          echo "======================================"
          id

          echo ""
          echo "======================================"
          echo "GROUPS"
          echo "======================================"
          groups

          echo ""
          echo "======================================"
          echo "DOCKER VERSION"
          echo "======================================"
          docker --version

          echo ""
          echo "======================================"
          echo "AWS CLI"
          echo "======================================"
          aws --version

          echo ""
          echo "======================================"
          echo "DOCKER SOCKET"
          echo "======================================"
          ls -l /var/run/docker.sock

          echo ""
          echo "======================================"
          echo "DOCKER INFO"
          echo "======================================"
          docker info

          echo ""
          echo "======================================"
          echo "DOCKER PS"
          echo "======================================"
          docker ps

      # --------------------------------------------------
      # 3. Verify AWS identity
      # --------------------------------------------------
      - name: Check AWS identity
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # --------------------------------------------------
      # 4. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to ECR
        run: |
          echo "Logging into Amazon ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "ECR login successful."

      # --------------------------------------------------
      # 5. Check ECR repository
      # --------------------------------------------------
      - name: Check ECR repository
        run: |
          echo "Checking ECR repository..."

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

          echo "ECR repository exists."

      # --------------------------------------------------
      # 6. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          echo "Building Docker image..."

          docker build \
            --pull \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REPOSITORY:latest" \
            .

          echo "Docker image built successfully."

      # --------------------------------------------------
      # 7. Tag Docker image
      # --------------------------------------------------
      - name: Tag Docker image
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "Tagging SHA image..."
          docker tag \
            "$ECR_REPOSITORY:${{ github.sha }}" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          echo "Tagging latest image..."
          docker tag \
            "$ECR_REPOSITORY:latest" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Images tagged successfully."

      # --------------------------------------------------
      # 8. Push image to ECR
      # --------------------------------------------------
      - name: Push image to ECR
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "Pushing SHA image..."
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          echo "Pushing latest image..."
          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          echo "Images pushed successfully."

      # --------------------------------------------------
      # 9. Stop existing container
      # --------------------------------------------------
      - name: Stop existing container
        run: |
          echo "Stopping existing container if it exists..."

          docker stop "$CONTAINER_NAME" || true

          echo "Removing existing container if it exists..."
          docker rm "$CONTAINER_NAME" || true

          echo "Old container removed."

      # --------------------------------------------------
      # 10. Pull exact image from ECR
      # --------------------------------------------------
      - name: Pull new image
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "Pulling image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          docker pull \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          echo "Image pulled successfully."

      # --------------------------------------------------
      # 11. Start new container
      # --------------------------------------------------
      - name: Start container
        run: |
          ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          echo "Starting container..."

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$HOST_PORT:$CONTAINER_PORT" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          echo "Container started."

      # --------------------------------------------------
      # 12. Verify deployment
      # --------------------------------------------------
      - name: Verify container
        run: |
          echo "Waiting for container to start..."
          sleep 5

          echo ""
          echo "======================================"
          echo "CONTAINER STATUS"
          echo "======================================"

          docker ps \
            --filter "name=$CONTAINER_NAME"

          RUNNING=$(docker inspect \
            -f '{{.State.Running}}' \
            "$CONTAINER_NAME" 2>/dev/null || echo "false")

          if [ "$RUNNING" != "true" ]; then
            echo ""
            echo "Container failed to start."
            echo ""
            echo "======================================"
            echo "CONTAINER LOGS"
            echo "======================================"

            docker logs "$CONTAINER_NAME" || true

            exit 1
          fi

          echo ""
          echo "Container is running successfully."

      # --------------------------------------------------
      # 13. Show deployment information
      # --------------------------------------------------
      - name: Deployment information
        run: |
          echo ""
          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Commit:     ${{ github.sha }}"
          echo "Repository: $ECR_REPOSITORY"
          echo "Region:     $AWS_REGION"
          echo "Container:  $CONTAINER_NAME"
          echo "Port:       $HOST_PORT"
          echo "======================================"

          echo ""
          echo "Running containers:"

          docker ps \
            --filter "name=$CONTAINER_NAME"

